# Outfit Matcher — ViT-S/16 from scratch, SupCon retrieval
# Training PC: 2x RTX 5090 (32GB each), Windows, gloo DDP

model:
  img_size: 224
  patch_size: 16
  dim: 384          # ~22M params + proj head
  depth: 12
  heads: 6
  mlp_ratio: 4.0
  drop_rate: 0.1
  drop_path_rate: 0.1
  proj_dim: 256

data:
  # UPDATE THESE PATHS to your actual data location on the training PC:
  manifest: D:/data/shirts/manifest_train.jsonl
  val_manifest: D:/data/shirts/manifest_val.jsonl
  img_size: 224
  bg_key_tolerance: 0.08
  bg_key_grow: 2
  p_composite: 0.85
  min_scale: 0.5
  max_scale: 1.0
  color_jitter: 0.4
  p_gray: 0.05
  p_perspective: 0.3
  p_occlusion: 0.5
  occlusion_scale: [0.02, 0.15]
  p_blur: 0.2
  p_noise: 0.2

train:
  epochs: 100
  garments_per_batch: 32   # P — garments per rank per step (global P = 64 across 2 GPUs)
  views_per_garment: 2     # V — SupCon positives per class (global batch = 256)
  workers: 8
  lr: 0.001
  min_lr: 0.00001
  warmup_epochs: 5
  weight_decay: 0.05
  temperature: 0.1
  aux_ce_weight: 0.5
  grad_clip: 1.0
  ema_decay: 0.999
  bf16: true
  log_every: 20
  eval_every: 5
  out_dir: runs/shirts_v1
  resume: null
  seed: 42

eval:
  batch_size: 64
  recall_k: [1, 5, 10, 20]
