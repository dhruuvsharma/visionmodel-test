# FRONT-ONLY PROTOTYPE — same as shirts.yaml but trains on front renders only.
# train.views: ["front"] filters TRAINING to front renders; eval and catalog
# encoding still use all 4 angles, so leave-one-view-out retrieval remains a
# meaningful (and harder) metric: can a front-only model still match a query
# to back/left/right catalog views?
# With 1 view/garment the SupCon positives become two independent augmentations
# of the same front image (SimCLR-style) — still a valid contrastive setup.

model:
  img_size: 224
  patch_size: 16
  dim: 384
  depth: 12
  heads: 6
  mlp_ratio: 4.0
  drop_rate: 0.1
  drop_path_rate: 0.1
  proj_dim: 256

data:
  manifest: D:/data/shirts/manifest_train.jsonl
  val_manifest: D:/data/shirts/manifest_val.jsonl
  img_size: 224
  bg_key_tolerance: 0.08
  bg_key_grow: 2
  p_composite: 0.85
  min_scale: 0.5
  max_scale: 1.0
  color_jitter: 0.4
  p_gray: 0.05
  p_perspective: 0.3
  p_occlusion: 0.5
  occlusion_scale: [0.02, 0.15]
  p_blur: 0.2
  p_noise: 0.2

train:
  views: [front]         # <<< the front-only switch (null = all views)
  epochs: 60            # fewer epochs: 4x less data per epoch
  garments_per_batch: 32
  views_per_garment: 2  # 2 augmented copies of the front view = positives
  workers: 8
  lr: 0.001
  min_lr: 0.00001
  warmup_epochs: 3
  weight_decay: 0.05
  temperature: 0.1
  aux_ce_weight: 0.5
  grad_clip: 1.0
  ema_decay: 0.999
  bf16: true
  log_every: 20
  eval_every: 5
  out_dir: runs/shirts_front_v1
  resume: null
  seed: 42

eval:
  batch_size: 64
  recall_k: [1, 5, 10, 20]
